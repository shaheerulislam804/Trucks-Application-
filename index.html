<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پاکستان ٹرک مینجمنٹ سسٹم</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Nastaliq Urdu', serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center">
    <div id="app" class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-6">
        
        <!-- لاگ ان اسکرین -->
        <div id="login-screen">
            <h1 class="text-2xl font-bold text-emerald-700 text-center mb-2">🚛 ٹرک مینجمنٹ سسٹم</h1>
            <p class="text-center text-slate-500 mb-6 text-sm">پنجاب و خیبر پختونخوا ٹرانسپورٹ پورٹل</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">یوزر نام / فون نمبر</label>
                    <input type="text" id="username" placeholder="مثلاً: admin یا driver1" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">پاس ورڈ</label>
                    <input type="password" id="password" placeholder="پاس ورڈ درج کریں" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button onclick="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg">
                    لاگ ان کریں
                </button>
            </div>
            
            <div class="mt-6 p-4 bg-slate-50 rounded-xl text-xs text-slate-600 space-y-1">
                <p><strong>ایڈمنز:</strong> admin (1234) | admin2 (5678)</p>
                <p><strong>ڈرائیورز:</strong> driver1 سے driver4 تک (پاس ورڈ: 1111 سے 4444)</p>
            </div>
        </div>

        <!-- ڈیش بورڈ اسکرین -->
        <div id="dashboard-screen" class="hidden">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h2 id="welcome-text" class="text-lg font-bold text-slate-800">خوش آمدید</h2>
                <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-semibold">لاگ آؤٹ</button>
            </div>
            <div id="dashboard-content" class="space-y-4">
                <!-- متحرک مواد -->
            </div>
        </div>

    </div>

    <script>
        const users = {
            'admin': { name: '👑 ایڈمن 1 (مین)', type: 'admin', pass: '1234' },
            'admin2': { name: '👑 ایڈمن 2', type: 'admin', pass: '5678' },
            'driver1': { name: '🚚 ڈرائیور 1', type: 'driver', pass: '1111', truck: 'ٹرک 1' },
            'driver2': { name: '🚚 ڈرائیور 2', type: 'driver', pass: '2222', truck: 'ٹرک 2' },
            'driver3': { name: '🚚 ڈرائیور 3', type: 'driver', pass: '3333', truck: 'ٹرک 3' },
            'driver4': { name: '🚚 ڈرائیور 4', type: 'driver', pass: '4444', truck: 'ٹرک 4' }
        };

        let currentUser = null;

        function handleLogin() {
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();

            if (users[userVal] && users[userVal].pass === passVal) {
                currentUser = users[userVal];
                currentUser.id = userVal;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                document.getElementById('welcome-text').innerText = currentUser.name;
                loadDashboard();
            } else {
                alert('غلط یوزر نام یا پاس ورڈ!');
            }
        }

        function loadDashboard() {
            let content = document.getElementById('dashboard-content');
            let trips = JSON.parse(localStorage.getItem('truck_trips') || '[]');

            if (currentUser.type === 'admin') {
                let totalTrips = trips.length;
                let totalIncome = trips.reduce((sum, t) => sum + Number(t.fare || 0), 0);
                let totalExpense = trips.reduce((sum, t) => sum + Number(t.diesel || 0) + Number(t.toll || 0) + Number(t.food || 0) + Number(t.repair || 0) + Number(t.extraCost || 0), 0);
                let netProfit = totalIncome - totalExpense;

                let tripsHtml = trips.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">ابھی تک کوئی ٹریپ درج نہیں ہوا۔</p>' :
                    trips.map(t => `
                        <div class="p-3 bg-slate-50 border rounded-xl text-xs space-y-1 shadow-sm">
                            <div class="flex justify-between font-bold text-slate-700">
                                <span>${t.truck} (${t.driverName})</span>
                                <span class="text-emerald-600">کرایہ: ${t.fare} روپے</span>
                            </div>
                            <p class="text-slate-600"><strong>مقام:</strong> ${t.from} سے ${t.to} (${t.date})</p>
                            <p class="text-slate-500">ڈیزل: ${t.diesel} | ٹول/چالان: ${t.toll} | کھانا: ${t.food} | مرمت: ${t.repair}</p>
                            ${t.extraName ? `<p class="text-purple-600">(${t.extraName}): ${t.extraCost} روپے</p>` : ''}
                            <div class="flex justify-between pt-1 border-t text-slate-700 font-semibold">
                                <span>کل خرچہ: ${Number(t.diesel)+Number(t.toll)+Number(t.food)+Number(t.repair)+Number(t.extraCost)}</span>
                                <span class="text-blue-700">خالص منافع: ${t.fare - (Number(t.diesel)+Number(t.toll)+Number(t.food)+Number(t.repair)+Number(t.extraCost))}</span>
                            </div>
                        </div>
                    `).join('');

                content.innerHTML = `
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl">
                            <p class="text-[11px] text-slate-500">کل ٹریپس</p>
                            <p class="text-base font-bold text-emerald-800">${totalTrips}</p>
                        </div>
                        <div class="p-2.5 bg-blue-50 border border-blue-200 rounded-xl">
                            <p class="text-[11px] text-slate-500">کل آمدنی</p>
                            <p class="text-base font-bold text-blue-800">${totalIncome}</p>
                        </div>
                        <div class="p-2.5 bg-purple-50 border border-purple-200 rounded-xl">
                            <p class="text-[11px] text-slate-500">خالص منافع</p>
                            <p class="text-base font-bold text-purple-800">${netProfit}</p>
                        </div>
                    </div>
                    <div class="border-t pt-3">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-slate-700 text-sm">تمام ٹرکوں کا تفصیلی ریکارڈ:</h3>
                            <button onclick="shareWhatsApp()" class="bg-green-600 text-white px-2.5 py-1 rounded-lg text-xs font-semibold">واٹس ایپ رپورٹ</button>
                        </div>
                        <div class="space-y-2 max-h-72 overflow-y-auto">${tripsHtml}</div>
                    </div>
                `;
            } else {
                // ڈرائیور پینل
                let driverTrips = trips.filter(t => t.driverId === currentUser.id);
                let myTripsHtml = driverTrips.map(t => `
                    <div class="p-2.5 bg-white border rounded-lg text-xs space-y-1">
                        <div class="flex justify-between font-bold">
                            <span>${t.from} ➔ ${t.to}</span>
                            <span class="text-emerald-600">کرایہ: ${t.fare}</span>
                        </div>
                        <p class="text-slate-500">تاریخ: ${t.date} | منافع: ${t.fare - (Number(t.diesel)+Number(t.toll)+Number(t.food)+Number(t.repair)+Number(t.extraCost))}</p>
                    </div>
                `).join('');

                content.innerHTML = `
                    <div class="p-4 bg-blue-50 border border-blue-200 rounded-xl space-y-3">
                        <h3 class="font-bold text-blue-800 text-sm">🚚 نیا ٹریپ فارم (${currentUser.truck})</h3>
                        <div class="space-y-2 text-xs">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" id="from_loc" placeholder="کہاں سے (روانگی)" class="w-full px-3 py-2 border rounded-lg bg-white outline-none">
                                <input type="text" id="to_loc" placeholder="کہاں تک (منزل)" class="w-full px-3 py-2 border rounded-lg bg-white outline-none">
                            </div>
                            <input type="number" id="fare" placeholder="کل کرایہ (روپے)" class="w-full px-3 py-2 border rounded-lg bg-white outline-none">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" id="diesel" placeholder="ڈیزل کا خرچہ" class="w-full px-3 py-2 border rounded-lg bg-white outline-none">
                                <input type="number" id="toll" placeholder="ٹول پلازہ / چالان" class="w-full px-3 py-2 border rounded-lg bg-white outline-none">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" id="food" placeholder="کھانے کا خرچہ" class="w-full px-3 py-2 border rounded-lg bg-white outline-none">
                                <input type="number" id="repair" placeholder="گاڑی مرمت/کام" class="w-full px-3 py-2 border rounded-lg bg-white outline-none">
                            </div>
                            <!-- اضافی خرچے کا خانہ -->
                            <div class="p-2 bg-white border rounded-lg space-y-2">
                                <p class="font-semibold text-slate-700">➕ اضافی خرچہ (اگر کوئی ہو)</p>
                                <input type="text" id="extra_name" placeholder="خرچے کا نام (مثلاً: لکیری/مزدوری)" class="w-full px-3 py-1.5 border rounded bg-slate-50 outline-none">
                                <input type="number" id="extra_cost" placeholder="رقم (روپے)" class="w-full px-3 py-1.5 border rounded bg-slate-50 outline-none">
                            </div>
                            <div>
                                <label class="block text-slate-600 mb-1">رسید یا بل کی تصویر (اختیاری)</label>
                                <input type="file" id="bill_img" accept="image/*" class="w-full text-[11px] file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white file:font-semibold">
                            </div>
                            <button onclick="saveTrip()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-semibold shadow">ٹریپ محفوظ کریں اور منافع حساب کریں</button>
                        </div>
                    </div>
                    
                    <div class="border-t pt-3">
                        <h4 class="font-bold text-slate-700 text-xs mb-2">میرے پچھلے ٹریپس:</h4>
                        <div class="space-y-2 max-h-40 overflow-y-auto">${myTripsHtml || '<p class="text-xs text-slate-500">کوئی ٹریپ نہیں ملا۔</p>'}</div>
                    </div>
                `;
            }
        }

        function saveTrip() {
            let from = document.getElementById('from_loc').value.trim();
            let to = document.getElementById('to_loc').value.trim();
            let fare = document.getElementById('fare').value.trim();
            
            if (!from || !to || !fare) {
                alert('براہ کرم روانگی، منزل اور کل کرایہ لازمی درج کریں!');
                return;
            }

            let diesel = document.getElementById('diesel').value.trim() || 0;
            let toll = document.getElementById('toll').value.trim() || 0;
            let food = document.getElementById('food').value.trim() || 0;
            let repair = document.getElementById('repair').value.trim() || 0;
            let extraName = document.getElementById('extra_name').value.trim() || '';
            let extraCost = document.getElementById('extra_cost').value.trim() || 0;

            let fileInput = document.getElementById('bill_img');
            let reader = new FileReader();

            let saveData = (imgData) => {
                let trips = JSON.parse(localStorage.getItem('truck_trips') || '[]');
                trips.unshift({
                    driverId: currentUser.id,
                    driverName: currentUser.name,
                    truck: currentUser.truck,
                    from: from,
                    to: to,
                    fare: Number(fare),
                    diesel: Number(diesel),
                    toll: Number(toll),
                    food: Number(food),
                    repair: Number(repair),
                    extraName: extraName,
                    extraCost: Number(extraCost),
                    image: imgData || '',
                    date: new Date().toLocaleDateString()
                });

                localStorage.setItem('truck_trips', JSON.stringify(trips));
                alert('ٹریپ کامیابی سے محفوظ ہو گیا اور منافع کا حساب لگ گیا!');
                loadDashboard();
            };

            if (fileInput && fileInput.files && fileInput.files[0]) {
                reader.onload = function(e) {
                    saveData(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveData('');
            }
        }

        function shareWhatsApp() {
            let trips = JSON.parse(localStorage.getItem('truck_trips') || '[]');
            let totalIncome = trips.reduce((sum, t) => sum + Number(t.fare || 0), 0);
            let totalExpense = trips.reduce((sum, t) => sum + Number(t.diesel || 0) + Number(t.toll || 0) + Number(t.food || 0) + Number(t.repair || 0) + Number(t.extraCost || 0), 0);
            let netProfit = totalIncome - totalExpense;

            let text = `🚛 *ٹرک مینجমেন্ট سسٹم رپورٹ*\n\n📊 کل ٹریپس: ${trips.length}\n💰 کل آمدنی: ${totalIncome} روپے\n📉 کل خرچے: ${totalExpense} روپے\n📈 خالص منافع: ${netProfit} روپے\n\n- تیار کردہ: پورٹل سسٹم`;
            let encoded = encodeURIComponent(text);
            window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
        }

        function logout() {
            currentUser = null;
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
