<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پاکستان ٹرک مینجمنٹ سسٹم</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Nastaliq Urdu', serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center">
    <div id="app" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6">
        
        <!-- لاگ ان اسکرین -->
        <div id="login-screen">
            <h1 class="text-2xl font-bold text-emerald-700 text-center mb-2">🚛 ٹرک مینجمنٹ سسٹم</h1>
            <p class="text-center text-slate-500 mb-6 text-sm">پنجاب و خیبر پختونخوا ٹرانسپورٹ پورٹل</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">یوزر نام</label>
                    <input type="text" id="username" placeholder="مثلاً: admin یا driver1" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">پاس ورڈ</label>
                    <input type="password" id="password" placeholder="پاس ورڈ درج کریں" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button onclick="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg">
                    لاگ ان کریں
                </button>
            </div>
            
            <div class="mt-6 p-4 bg-slate-50 rounded-xl text-xs text-slate-600 space-y-1">
                <p><strong>ایڈمن:</strong> admin / 1234</p>
                <p><strong>ڈرائیور 1:</strong> driver1 / 1111</p>
            </div>
        </div>

        <!-- ڈیش بورڈ اسکرین -->
        <div id="dashboard-screen" class="hidden">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h2 id="welcome-text" class="text-lg font-bold text-slate-800">خوش آمدید</h2>
                <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-semibold">لاگ آؤٹ</button>
            </div>
            <div id="dashboard-content" class="space-y-4">
                <!-- متحرک مواد -->
            </div>
        </div>

    </div>

    <script>
        const users = {
            'admin': { name: '👑 ایڈمن (مین)', type: 'admin', pass: '1234' },
            'driver1': { name: '🚚 ڈرائیور 1 (ٹرک 1)', type: 'driver', pass: '1111', truck: 'ٹرک 1' }
        };

        let currentUser = null;

        function handleLogin() {
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();

            if (users[userVal] && users[userVal].pass === passVal) {
                currentUser = users[userVal];
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                document.getElementById('welcome-text').innerText = currentUser.name;
                loadDashboard();
            } else {
                alert('غلط یوزر نام یا پاس ورڈ!');
            }
        }

        function loadDashboard() {
            let content = document.getElementById('dashboard-content');
            let trips = JSON.parse(localStorage.getItem('truck_trips') || '[]');

            if (currentUser.type === 'admin') {
                let totalTrips = trips.length;
                let totalIncome = trips.reduce((sum, t) => sum + Number(t.fare || 0), 0);

                let tripsHtml = trips.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">ابھی تک کوئی ٹریپ درج نہیں ہوا۔</p>' :
                    trips.map(t => `
                        <div class="p-3 bg-slate-50 border rounded-xl text-xs space-y-1">
                            <div class="flex justify-between font-bold text-slate-700">
                                <span>${t.truck} (${t.driverName})</span>
                                <span class="text-emerald-600">کرایہ: ${t.fare} روپے</span>
                            </div>
                            <p class="text-slate-500">مقام: ${t.from} سے ${t.to}</p>
                            <p class="text-slate-500">ڈیزل: ${t.diesel} | خرچہ: ${t.toll}</p>
                        </div>
                    `).join('');

                content.innerHTML = `
                    <div class="grid grid-cols-2 gap-2 text-center">
                        <div class="p-3 bg-emerald-50 border rounded-xl">
                            <p class="text-xs text-slate-500">کل ٹریپس</p>
                            <p class="text-lg font-bold text-emerald-800">${totalTrips}</p>
                        </div>
                        <div class="p-3 bg-blue-50 border rounded-xl">
                            <p class="text-xs text-slate-500">کل آمدنی</p>
                            <p class="text-lg font-bold text-blue-800">${totalIncome}</p>
                        </div>
                    </div>
                    <div class="border-t pt-3">
                        <h3 class="font-bold text-slate-700 text-sm mb-2">تمام ٹریپس کا ریکارڈ:</h3>
                        <div class="space-y-2 max-h-60 overflow-y-auto">${tripsHtml}</div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="p-4 bg-blue-50 border border-blue-200 rounded-xl space-y-3">
                        <h3 class="font-bold text-blue-800 text-sm">🚚 نیا ٹریپ فارم (${currentUser.truck})</h3>
                        <div class="space-y-2 text-xs">
                            <input type="text" id="from_loc" placeholder="کہاں سے (مثلاً: پشاور)" class="w-full px-3 py-2 border rounded-lg bg-white">
                            <input type="text" id="to_loc" placeholder="کہاں تک (مثلاً: لاہور)" class="w-full px-3 py-2 border rounded-lg bg-white">
                            <input type="number" id="fare" placeholder="کل کرایہ (روپے)" class="w-full px-3 py-2 border rounded-lg bg-white">
                            <input type="number" id="diesel" placeholder="ڈیزل کا خرچہ (روپے)" class="w-full px-3 py-2 border rounded-lg bg-white">
                            <input type="number" id="toll" placeholder="چالان / روڈ ٹیکس (روپے)" class="w-full px-3 py-2 border rounded-lg bg-white">
                            <button onclick="saveTrip()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold shadow">ٹریپ محفوظ کریں</button>
                        </div>
                    </div>
                `;
            }
        }

        function saveTrip() {
            let from = document.getElementById('from_loc').value.trim();
            let to = document.getElementById('to_loc').value.trim();
            let fare = document.getElementById('fare').value.trim();
            let diesel = document.getElementById('diesel').value.trim();
            let toll = document.getElementById('toll').value.trim();

            if (!from || !to || !fare) {
                alert('براہ کرم روانگی، منزل اور کرایہ لازمی درج کریں!');
                return;
            }

            let trips = JSON.parse(localStorage.getItem('truck_trips') || '[]');
            trips.unshift({
                truck: currentUser.truck,
                driverName: currentUser.name,
                from: from,
                to: to,
                fare: fare,
                diesel: diesel || 0,
                toll: toll || 0,
                date: new Date().toLocaleDateString()
            });

            localStorage.setItem('truck_trips', JSON.stringify(trips));
            alert('ٹریپ کامیابی سے محفوظ ہو گیا!');
            loadDashboard();
        }

        function logout() {
            currentUser = null;
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
